# build-gateway — the Caddy+DuckDNS plugin image (TLS_MODE=dns01 fallback for
# appliances that cannot do HTTP-01). Machinery, built here since ADR-0010.
#
# Appliances never run what this pushes by its tag: they run the digest pinned in
# bin/lib/common.sh (GATEWAY_DNS01_IMAGE), moved there by a reviewed change. So after
# a build, copy the digest from this run's summary into that pin; bin/digest-check.py
# fails daily until it is moved. Every action is pinned to a commit (the same commits
# the Workforce source repository's publish.yml uses).
name: build-gateway
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ gateway/**, .github/workflows/build-gateway.yml ]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./gateway
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/workforce-deploy-gateway:latest
      - name: The digest to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the build: '$DIGEST'"; exit 1; }
          {
            echo "### workforce-deploy-gateway built"
            echo "Pin it in bin/lib/common.sh, in a reviewed change:"
            echo
            echo "\`GATEWAY_DNS01_IMAGE=\"ghcr.io/marlon-thomas/workforce-deploy-gateway:latest@${DIGEST}\"\`"
          } >> "$GITHUB_STEP_SUMMARY"
