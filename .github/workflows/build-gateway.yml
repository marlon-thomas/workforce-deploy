# build-gateway — the Caddy+DuckDNS plugin image (TLS_MODE=dns01 fallback for
# appliances that cannot do HTTP-01). Machinery, built here since ADR-0010.
name: build-gateway
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ gateway/**, .github/workflows/build-gateway.yml ]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/workforce-deploy-gateway:latest
