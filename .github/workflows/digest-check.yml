# digest-check — CI canary for image pin honesty (ADR-0015; every pin since Workforce issue 53).
#
# Born from a live incident: a one-hex-char typo in a compose @sha256 pin
# failed three converge attempts and looked exactly like a registry outage.
# The daemon was right; CI would have caught it. This workflow re-verifies,
# against the bytes the registries serve today, every image this repo pins by
# digest (compose files, scripts, Ansible templates, the gateway's Dockerfile):
# each digest must still be served, as exactly those bytes, and our own rebuilt
# images' tags must still name them. A third-party tag that has moved on to a
# newer build is a warning: appliances keep the tested bytes until someone
# repins deliberately. bin/digest-check.py has the rules; it runs by hand too.
name: digest-check
on:
  schedule:
    - cron: "0 6 * * *"           # daily — upstream retags surface here, not in an install
  push:
    paths:
      - compose*.yaml
      - bin/**
      - ansible/roles/workforce/templates/env.j2
      - gateway/Dockerfile
      - .github/workflows/digest-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every digest pin against its registry
        run: python3 -I bin/digest-check.py
