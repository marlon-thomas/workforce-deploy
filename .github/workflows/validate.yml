# validate — static checks for the deploy apparatus on every push and PR
# (audit Q1). Compose syntax, shell syntax and python syntax breakage is
# caught here, not on an appliance at its next converge. The checks live in
# bin/ci-validate.sh so they run identically on a workstation.
name: validate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation (bash -n, python, docker compose config, shellcheck)
        run: ./bin/ci-validate.sh
      # The helper runs in the backup container, so its self-test runs there too: alpine, busybox,
      # as root, which is also what proves the mailbox's modes for the app's uid 999.
      - name: The server-actions self-test on alpine with busybox
        run: |
          printf 'apk add -q --no-progress bash jq openssl >/dev/null\nbash /w/bin/tests/server-actions-test.sh\n' > "$RUNNER_TEMP/alpine-run.sh"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/s:ro" alpine:3.20 sh /s/alpine-run.sh
      # Off-site encryption runs there as well, and that image has a real age for the round trips,
      # which the plain run above skips.
      - name: The off-site encryption self-tests on alpine with a real age
        run: |
          printf 'apk add -q --no-progress bash jq openssl age curl python3 >/dev/null\nset -e\nbash /w/bin/tests/backup-encrypt-test.sh\nbash /w/bin/tests/install-questions-test.sh\nbash /w/bin/tests/healthwatch-test.sh\n' > "$RUNNER_TEMP/alpine-encrypt.sh"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/s:ro" alpine:3.20 sh /s/alpine-encrypt.sh
      # recover.sh reads the second part of a copy with GNU tar, as a server has; busybox's stops at the first.
      - name: The recovery self-test on alpine with a real age and GNU tar
        run: |
          printf 'apk add -q --no-progress bash jq openssl age curl python3 tar >/dev/null\nbash /w/bin/tests/recovery-test.sh\n' > "$RUNNER_TEMP/alpine-recovery.sh"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/s:ro" alpine:3.20 sh /s/alpine-recovery.sh
      - name: Off-site encryption end to end (real age, real rsync over ssh to a write-only key, helper container)
        run: ./bin/tests/backup-encrypt-e2e.sh
