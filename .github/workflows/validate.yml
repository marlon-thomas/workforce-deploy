# validate — static checks for the deploy apparatus on every push and PR
# (audit Q1). Compose syntax, shell syntax and python syntax breakage is
# caught here, not on an appliance at its next converge. The checks live in
# bin/ci-validate.sh so they run identically on a workstation.
name: validate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static validation (bash -n, python, docker compose config, shellcheck)
        run: ./bin/ci-validate.sh
      # The helper runs in the backup container, so its self-test runs there too: alpine, busybox,
      # as root, which is also what proves the mailbox's modes for the app's uid 999.
      - name: The server-actions self-test on alpine with busybox
        run: |
          printf 'apk add -q --no-progress bash jq openssl >/dev/null\nbash /w/bin/tests/server-actions-test.sh\n' > "$RUNNER_TEMP/alpine-run.sh"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/s:ro" alpine:3.20.10@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc sh /s/alpine-run.sh
      # Off-site encryption runs there as well, and that image has a real age for the round trips,
      # which the plain run above skips.
      - name: The off-site encryption self-tests on alpine with a real age
        run: |
          printf 'apk add -q --no-progress bash jq openssl age curl python3 >/dev/null\nset -e\nbash /w/bin/tests/backup-encrypt-test.sh\nbash /w/bin/tests/install-questions-test.sh\nbash /w/bin/tests/healthwatch-test.sh\n' > "$RUNNER_TEMP/alpine-encrypt.sh"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/s:ro" alpine:3.20.10@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc sh /s/alpine-encrypt.sh
      # recover.sh reads the second part of a copy with GNU tar, as a server has; busybox's stops at the first.
      - name: The recovery self-test on alpine with a real age and GNU tar
        run: |
          printf 'apk add -q --no-progress bash jq openssl age curl python3 tar >/dev/null\nbash /w/bin/tests/recovery-test.sh\n' > "$RUNNER_TEMP/alpine-recovery.sh"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP:/s:ro" alpine:3.20.10@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc sh /s/alpine-recovery.sh
      # What the appliance controller runs (doctor.sh, healthwatch.sh, backup.sh, server-actions.sh), on its own base
      # image: busybox on musl, which refuses a regular-expression bound over 255 and has no flock -w.
      - name: The controller's scripts' self-tests on its base image (busybox on musl)
        run: ./bin/tests/controller-busybox-e2e.sh
      - name: Off-site encryption end to end (real age, real rsync over ssh to a write-only key, helper container)
        run: ./bin/tests/backup-encrypt-e2e.sh
      # Review of the controller bundle (finding 7): the health watch's own database role against a real PostgreSQL
      # (Workforce issue 447: SELECT on the columns doctor.sh reads and nothing else), and image signatures checked
      # against a real registry with the pinned cosign. Neither is in ci-validate.sh, which needs no Docker.
      - name: The health watch's database role end to end (real PostgreSQL)
        run: ./bin/tests/health-db-role-e2e.sh
      - name: Release signatures end to end (a local registry, the pinned cosign)
        run: ./bin/tests/verify-image-e2e.sh
      # Second review of the controller bundle (findings 2, 4 and 6): the sign-in policies that use authentik's own
      # code run on the pinned authentik image, with fakes for the database. reset-admin.sh's program runs on a real
      # database in the live job below (authentik-lock-e2e.sh, section 9), not here (final review, finding 8).
      - name: The sign-in policies on the pinned authentik
        run: ./bin/tests/authentik-policies-e2e.sh
      # Workforce issue 462: the gateway decides each client's address (every gateway file, on the pinned Caddy, with
      # forged headers and named proxies), and the wrong-password pause, the throttle, workplaces, unlocks, wrong codes
      # and the emergency administrator's password rule on a live authentik at the compose.yaml pin (the blueprint
      # applied twice), signing in through its real flow executor and the real gateway. One live authentik at a time.
      - name: Client addresses through every gateway file (the pinned Caddy)
        run: ./bin/tests/gateway-client-address-e2e.sh
      - name: Wrong passwords, the throttle, unlocks and reset-admin.sh on a live authentik (the pin, through the gateway)
        run: |
          python3 -c 'import jinja2' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q python3-jinja2; }
          ./bin/tests/authentik-lock-e2e.sh
