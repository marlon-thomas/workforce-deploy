all:
  hosts:
    workforce-dev:
      ansible_host: 192.168.121.x   # vagrant: filled by 'vagrant ssh-config'
      ansible_connection: local     # or ssh to the VM
      ansible_user: vagrant
      service_user: workforce_app_sa
      base_domain: duckdns.org
      app_hostname: app.workforce-dev.duckdns.org
      auth_hostname: auth.workforce-dev.duckdns.org
      env_name: dev
      tls_mode: tailscale
