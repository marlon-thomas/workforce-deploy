---
# workforce — application plane: env, truststore, app containers (after identity
# plane convergence, handled by the authentik role).

- name: .env present with pinned version and correct image path
  ansible.builtin.template:
    src: env.j2
    dest: /opt/workforce-deploy/.env
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0600"
  no_log: true   # carries SMTP_PASSWORD / DUCKDNS_API_TOKEN (--diff would print them)
  # bin/recover.sh: the .env that came back holds settings this template has never heard of (staff
  # email, the AI service, feedback), and rendering it here would lose them.
  when: not (keep_env | default(false) | bool)

- name: api JVM truststore — local test-CA file in certs mode (deterministic,
    network-free, no race with the gateway's own cert rotation), presented
    chain via s_client otherwise
  ansible.builtin.shell: |
    set -o pipefail
    if [ -f /opt/workforce-deploy/secrets/tls/ca.crt ]; then
      openssl x509 -in /opt/workforce-deploy/secrets/tls/ca.crt -outform DER \
        > /tmp/auth-cert.der
    else
      echo | openssl s_client -connect {{ auth_hostname }}:443 -servername {{ auth_hostname }} 2>/dev/null \
        | openssl x509 -outform DER > /tmp/auth-cert.der
    fi
    docker run --rm -v /opt/workforce-deploy/secrets:/out eclipse-temurin:25-jre \
      keytool -importcert -noprompt -alias careangels-gateway \
      -file /out/auth-cert.der -keystore /out/api-truststore.jks -storepass changeit
    chmod 644 /opt/workforce-deploy/secrets/api-truststore.jks
  args:
    executable: /bin/bash
  changed_when: true

- name: Export authentik's JWT signing public key (static-key id_token validation)
  ansible.builtin.shell: |
    set -euo pipefail
    cd /opt/workforce-deploy
    . ./bin/lib/common.sh
    export_oidc_signing_key
  args:
    executable: /bin/bash
  changed_when: true

# Web-push VAPID keypair (#30). Generate once, never rotate in place (browser
# subscriptions bind to this key; rotation silently orphans every device). Compose
# mounts these as configtree secrets (workforce.push.public-key / .private-key), and
# the compose task below hard-fails if they are absent, so this must run first. The
# wizard's own copy in install.sh only fires on a true first install; resumed deploys
# skip it, which is why the guard lives here too. Absence of EITHER regenerates BOTH
# (a mismatched pair is worse than none).
- name: Generate the web-push VAPID keypair if absent
  ansible.builtin.shell: |
    set -euo pipefail
    cd /opt/workforce-deploy
    if [ -s secrets/push_vapid_public ] && [ -s secrets/push_vapid_private ]; then
      echo "vapid: unchanged"; exit 0
    fi
    TMP="$(mktemp)"
    openssl ecparam -name prime256v1 -genkey -noout -out "$TMP"
    openssl pkey -in "$TMP" -pubout -outform DER | tail -c 65 \
      | python3 -c 'import sys,base64;sys.stdout.write(base64.urlsafe_b64encode(sys.stdin.buffer.read()).decode().rstrip("="))' > secrets/push_vapid_public
    openssl pkey -in "$TMP" -text -noout | awk '/priv:/{f=1;next} /^pub:/{f=0} f' \
      | tr -d ' :\n' | tail -c 64 \
      | python3 -c 'import sys,base64;sys.stdout.write(base64.urlsafe_b64encode(bytes.fromhex(sys.stdin.read().strip())).decode().rstrip("="))' > secrets/push_vapid_private
    rm -f "$TMP"
    chown {{ service_user }}:{{ service_user }} secrets/push_vapid_public secrets/push_vapid_private
    echo "vapid: generated"
  args:
    executable: /bin/bash
  register: vapid_gen
  changed_when: "'vapid: generated' in vapid_gen.stdout"


# ADR-0021: the AI assistant's secrets, for servers installed before they existed. The credential
# key encrypts organisations' own AI keys; regenerating it would make those unreadable (they would
# have to be entered again), so it is created only when absent. The server-wide key starts empty.
- name: Create the AI assistant secrets if absent
  ansible.builtin.shell: |
    set -euo pipefail
    cd /opt/workforce-deploy
    made=""
    if [ ! -s secrets/ai_credential_key ]; then
      openssl rand -base64 32 | tr -d '\n' > secrets/ai_credential_key; made="key"
    fi
    if [ ! -e secrets/ai_api_key ]; then : > secrets/ai_api_key; made="$made api"; fi
    if [ ! -e secrets/feedback_github_key ]; then : > secrets/feedback_github_key; made="$made feedback"; fi
    for f in mail_admin_password mail_db_password mail_lookup_key webmail_oidc_secret webmail_des_key; do
      if [ ! -s "secrets/$f" ]; then openssl rand -hex 24 | tr -d '\n' > "secrets/$f"; made="$made $f"; fi
    done
    if [ ! -e secrets/mail_relay_password ]; then : > secrets/mail_relay_password; made="$made relay"; fi
    chown {{ service_user }}:{{ service_user }} secrets/ai_credential_key secrets/ai_api_key secrets/feedback_github_key \
      secrets/mail_admin_password secrets/mail_db_password secrets/mail_lookup_key secrets/mail_relay_password \
      secrets/webmail_oidc_secret secrets/webmail_des_key
    echo "ai secrets: ${made:-unchanged}"
  args:
    executable: /bin/bash
  register: ai_secrets
  changed_when: "'unchanged' not in ai_secrets.stdout"

# One rule for every secret's mode, bin/lib/common.sh secret_modes, run after everything that makes
# them. The containers read them as uid 999, so 0600 here left staff email, the assistant and feedback
# silently off until the next update.
- name: Secret files readable inside the containers, the folder closed
  ansible.builtin.shell: |
    set -euo pipefail
    cd /opt/workforce-deploy
    . ./bin/lib/common.sh
    # A file this account cannot change must not stop an install: the "app secrets" health row names it.
    secret_modes || echo "some secret modes could not be set"
  args:
    executable: /bin/bash
  changed_when: false

- name: Service user uid
  ansible.builtin.command: id -u {{ service_user }}
  register: su_uid
  changed_when: false

- name: Application plane up — as the SERVICE USER (rootless daemon owns the
        containers and its docker config holds the GHCR credential; running this
        as root would pull unauthorized and manage a second, empty daemon)
  community.docker.docker_compose_v2:
    project_src: /opt/workforce-deploy
    files:
      - compose.yaml
    state: present
    pull: missing
  environment:
    DOCKER_HOST: "unix:///run/user/{{ su_uid.stdout }}/docker.sock"
    XDG_RUNTIME_DIR: "/run/user/{{ su_uid.stdout }}"


- name: application ready (build-meta answers 200)
  ansible.builtin.uri:
    url: "https://{{ app_hostname }}/api/v1/build-meta"
    status_code: 200
    validate_certs: false
  register: buildmeta
  retries: 60
  delay: 10
  until: buildmeta.status == 200

# Issue 289: Caddy reads its Caddyfile only at start, and the compose task above leaves a gateway
# whose definition did not change running. A re-run of the installer after a bundle change reloads
# it here (no downtime); a fresh install, or an unchanged Caddyfile, only confirms it.
- name: Gateway runs this bundle's Caddyfile (reloaded when it changed)
  ansible.builtin.command: ./bin/gateway-reload.sh
  args:
    chdir: /opt/workforce-deploy
  environment:
    DOCKER_HOST: "unix:///run/user/{{ su_uid.stdout }}/docker.sock"
    XDG_RUNTIME_DIR: "/run/user/{{ su_uid.stdout }}"
  register: gateway_reload
  changed_when: "'gateway unchanged' not in gateway_reload.stdout"
