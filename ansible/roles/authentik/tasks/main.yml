---
# authentik — the file-mode and mount correctness that two live deployments
# proved critical, declared as convergent state instead of shell sequences.

- name: secrets directory
  ansible.builtin.file:
    path: /opt/workforce-deploy/secrets
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0700"

- name: "ak_config.yml rendered (rootless-readable 0444, not 0600)"
  ansible.builtin.copy:
    content: |
      secret_key: {{ ak_secret }}
      postgresql:
        password: {{ ak_db_password }}
    dest: /opt/workforce-deploy/secrets/ak_config.yml
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0444"
  vars:
    ak_secret: "{{ lookup('file', '/opt/workforce-deploy/secrets/ak_secret') }}"
    ak_db_password: "{{ lookup('file', '/opt/workforce-deploy/secrets/ak_db_password') }}"

- name: OIDC client credentials read from the secrets the installer generated
  ansible.builtin.set_fact:
    oidc_client_id: "{{ lookup('file', '/opt/workforce-deploy/secrets/oidc_client_id') }}"
    oidc_client_secret: "{{ lookup('file', '/opt/workforce-deploy/secrets/oidc_client_secret') }}"
    acme_email: "{{ lookup('env', 'ACME_EMAIL') | default('admin@example.com', true) }}"

- name: blueprint rendered from values
  ansible.builtin.template:
    src: workforce-app.yaml.j2
    dest: /opt/workforce-deploy/blueprints/workforce-app.yaml
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0644"
  register: blueprint_render

- name: Service user uid (rootless docker socket lives in their runtime dir)
  ansible.builtin.command: id -u {{ service_user }}
  register: ak_su_uid
  changed_when: false

# Identity plane first — sequenced start. gateway is deliberately NOT in the
# list: it hard-depends on api, whose discovery-gate can only pass after THIS
# role converges; including it deadlocks the up call (api+gateway Created).
- name: compose up (identity plane)
  community.docker.docker_compose_v2:
    project_src: /opt/workforce-deploy
    files:
      - compose.yaml
    services:
      - authentik-postgres
      - ak-redis
      - authentik-server
      - authentik-worker
      # NOTE: gateway deliberately NOT here — it hard-depends on api, whose
      # discovery-gate sidecar can only pass after THIS role converges.
      # Including it deadlocks the up call (api+gateway sit Created forever).
      # The workforce role's full-stack up starts gateway with the app plane.
      - postgres
      - object-storage
      - clamav
      - gotenberg
    state: present
  environment:
    # Rootless docker: the daemon's socket is the service user's runtime
    # socket, never /var/run/docker.sock (permission denied as the service
    # user — and wrong even for root on a rootless-only host).
    DOCKER_HOST: "unix:///run/user/{{ ak_su_uid.stdout }}/docker.sock"

# Single-file bind mounts pin the inode from container CREATE time; the
# template task renames the file, so the running worker would keep reading a
# deleted blueprint. Recreate on change to rebind.
- name: rebind blueprint mount
  # Single-file bind mounts pin the inode that existed at container CREATE
  # time. The template task replaces the file (atomic rename = new inode), so
  # a long-running worker keeps reading a deleted old blueprint — the stale
  # label re-errored forever. Recreate whenever the render changed.
  community.docker.docker_compose_v2:
    project_src: /opt/workforce-deploy
    files:
      - compose.yaml
    services:
      - authentik-server
      - authentik-worker
    recreate: always
    state: present
  when: blueprint_render is changed
  environment:
    DOCKER_HOST: "unix:///run/user/{{ ak_su_uid.stdout }}/docker.sock"

# Deterministic CLI import — not the worker's periodic scan (observed to stop
# scheduling silently; an 'error' instance persists until force-reapplied).
- name: blueprint applied
  # plain `docker exec` via command: immune to community.docker collection
  # version drift across installs (older versions lack arguments/working_directory)
  ansible.builtin.command: >-
    docker exec -w / workforce-deploy-authentik-server-1
    python /manage.py apply_blueprint /blueprints/workforce-app.yaml
  register: ak_bp
  until: (ak_bp.rc | default(1)) == 0 and 'Blueprint invalid' not in (ak_bp.stdout | default(''))
  retries: 40
  delay: 10
  environment:
    DOCKER_HOST: "unix:///run/user/{{ ak_su_uid.stdout }}/docker.sock"

# Internal probe only — the public URL would need the gateway, which belongs
# to the app plane (workforce role proves the edge via build-meta).
- name: OIDC provider answers internally
  ansible.builtin.command:
    cmd: >-
      docker exec -w / workforce-deploy-authentik-server-1 python -c
      "import urllib.request,sys;
      sys.exit(0 if urllib.request.urlopen('http://localhost:9000/application/o/workforce/.well-known/openid-configuration', timeout=5).status == 200 else 1)"
  register: ak_disc
  until: (ak_disc.rc | default(1)) == 0
  retries: 40
  delay: 10
  environment:
    DOCKER_HOST: "unix:///run/user/{{ ak_su_uid.stdout }}/docker.sock"
